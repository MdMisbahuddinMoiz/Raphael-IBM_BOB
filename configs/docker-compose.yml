x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-host-config: &host-config
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  cai-service:
    build:
      context: ./src/cai-service
      dockerfile: Dockerfile
    ports:
      - "3201:3200"
    env_file: .env
    environment:
      - SERVICE_NAME=cai-service
      - RAPHAEL_PATH=/raphael
    volumes:
      - ./src/orchestrator:/raphael/orchestrator

    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - tor-proxy
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped
    <<: *host-config

  mhddos-service:
    <<: *host-config
    build:
      context: ./src/mhddos-service
      dockerfile: Dockerfile
    ports:
      - "3301:3300"
    env_file: .env
    environment:
      - SERVICE_NAME=mhddos-service
      - TOR_PROXY=socks5h://tor-proxy:9050
    cap_add:
      - NET_RAW
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - tor-proxy
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  cloak-service:
    <<: *host-config
    build:
      context: ./src/cloak-service
      dockerfile: Dockerfile
    ports:
      - "3401:3400"
    env_file: .env
    environment:
      - SERVICE_NAME=cloak-service
      - TOR_PROXY=http://tor-proxy:8118
      - TOR_CONTROL=tor-proxy:9051
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./src/cloak-service:/app/app:ro
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3400"]
    depends_on:
      - tor-proxy
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  c2-server:
    <<: *host-config
    build:
      context: ./src/c2-server
      dockerfile: Dockerfile
    ports:
      - "3501:3501"
    env_file: .env
    environment:
      - SERVICE_NAME=c2-server
      - RAPHAEL_PATH=/raphael
      - SLIVER_OPERATOR_CONFIG=/sliver-config/operator.cfg
      - PYTHONPATH=/app:/raphael
    volumes:
      - ./src/orchestrator:/raphael/orchestrator
      - sliver-config:/sliver-config:rw
    working_dir: /
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3501"]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - neo4j
      - sliver-server
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  phishing:
    <<: *host-config
    build:
      context: ./src/phishing
      dockerfile: Dockerfile
    ports:
      - "3502:3502"
    env_file: .env
    environment:
      - SERVICE_NAME=phishing
      - RAPHAEL_PATH=/raphael
    volumes:
      - ./src/orchestrator:/raphael/orchestrator
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  recon-pipeline:
    <<: *host-config
    build:
      context: ./src/recon-pipeline
      dockerfile: Dockerfile
    ports:
      - "3503:3503"
    env_file: .env
    environment:
      - SERVICE_NAME=recon-pipeline
      - RAPHAEL_PATH=/raphael
      - PYTHONPATH=/app/app:/raphael
    volumes:
      - ./src/orchestrator:/raphael/orchestrator
      - case-data:/data
      - ./src/recon-pipeline:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3503"]
    cap_add:
      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - tor-proxy
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  sword:
    <<: *host-config
    build:
      context: ./src
      dockerfile: ./sword/Dockerfile
    ports:
      - "3600:3600"
    env_file: .env
    environment:
      - SERVICE_NAME=sword
    volumes:
      - ./src/orchestrator:/app/orchestrator
      - ./src/sword:/app/sword
    cap_add:
      - NET_RAW
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - cai-service
      - mhddos-service
      - cloak-service
      - c2-server
      - phishing
      - recon-pipeline
      - tor-proxy
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  # NOTE (D-RECOVERY-01): autonomous-brain service removed — phantom definition.
  # Its Dockerfile (./brain/Dockerfile) never existed in any git revision, no image
  # was ever built, and no container ever ran. It blocked `docker compose up`.
  # D-Series Brain runs inside raphael-api (python -m orchestrator.api.main).

  tor-proxy:
    # Pin to specific version for stability; update after testing
    image: dperson/torproxy:latest
    ports:
      - "9050:9050"
      - "9052:9051"
    environment:
      - PASSWORD=${TOR_CONTROL_PASS:-changeme}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      raphael-net:
        aliases:
          - tor-proxy
    logging: *default-logging
    restart: unless-stopped

  sliver-server:
    build:
      context: ./sliver
      dockerfile: Dockerfile
    ports:
      - "31337:31337"
      - "31334:31334"
    volumes:
      - sliver-config:/config
      - sliver-data:/data
    environment:
      - SLIVER_LISEN_PORT=31337
    networks:
      raphael-net:
        aliases:
          - sliver-server
    logging: *default-logging
    restart: unless-stopped

  neo4j:
    # Pin to specific patch version for stability; update after testing
    image: neo4j:5-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASS:-raphael-dev}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=128M
      - NEO4J_dbms_memory_heap_max__size=256M
    volumes:
      - neo4j-data:/data
    networks:
      raphael-net:
        aliases:
          - neo4j
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  kali-tools:
    build:
      context: ./src/kali-tools
      dockerfile: Dockerfile
    # Pin to a specific tag after building for production; :latest may break on rebuild
    image: raphael/kali-tools:latest
    container_name: kali-tools
    hostname: kali-tools
    networks: [raphael-net]
    ports:
      - "3800:3800"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
    volumes:
      - ./src/orchestrator:/raphael/orchestrator:ro
      - ./data:/raphael/data
    environment:
      - TOOLS_PORT=3800
      - TZ=UTC
    logging: *default-logging
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    hostname: dvwa
    networks:
      - raphael-net
    ports:
      - "4280:80"
    environment:
      - DB_SERVER=db
      - DB_DATABASE=dvwa
      - DB_USERNAME=dvwa
      - DB_PASSWORD=p@ssw0rd
    depends_on:
      - dvwa-db
    logging: *default-logging
    restart: unless-stopped

  dvwa-db:
    image: mysql:8.0
    container_name: dvwa-db
    hostname: db
    networks:
      - raphael-net
    environment:
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
      - MYSQL_ROOT_PASSWORD=rootp@ssw0rd
    volumes:
      - dvwa-db-data:/var/lib/mysql
    logging: *default-logging
    restart: unless-stopped

  raphael-api:
    <<: *host-config
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    ports:
      - "3900:3900"
    env_file: .env
    environment:
      - SERVICE_NAME=raphael-api
      - RAPHAEL_PATH=/raphael
      - CI_API_PORT=3900
      - ORCHESTRATOR_API_PORT=3900
    volumes:
      - ./src/orchestrator:/raphael/orchestrator
      - ./cli:/raphael/cli
      - ./data:/data
    depends_on:
      - tor-proxy
    networks:
      - raphael-net
    logging: *default-logging
    restart: unless-stopped

  caido:
    # Pin to specific version for stability; update after testing
    image: caido/caido:latest
    ports:
      - "48080:8080"
    environment:
      - CAIDO_PORT=8080
    networks:
      raphael-net:
        aliases:
          - caido
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  raphael-net:
    driver: bridge

volumes:
  brain-data:
  case-data:
  neo4j-data:
  sliver-config:
  sliver-data:
  dvwa-db-data:
